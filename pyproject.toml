[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proto_gap"
version = "0.1.0"
description = "Static analyzer for AI-generated prototype codebases that produces a prioritized production-readiness gap checklist."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "proto_gap contributors" }
]
keywords = ["static-analysis", "code-review", "production-readiness", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
proto-gap = "proto_gap.cli:app"

[project.urls]
Homepage = "https://github.com/example/proto_gap"
Repository = "https://github.com/example/proto_gap"

[tool.hatch.build.targets.wheel]
packages = ["proto_gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
